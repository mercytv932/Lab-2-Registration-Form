<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        padding: 40px 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #eef2ff, #f8fafc);
      }
      form {
        width: 100%;
        max-width: 800px;
        padding: 40px;
        background-color: white;
        display: flex;
        flex-direction: column;
        border-radius: 16px;
        box-shadow: 0 12px 35px rgb(0, 0, 0, 0.1);
      }

      .main-header {
        display: flex;
        flex-direction: column;
        font-style: sans-serif;
      }

      .main-header h1 {
        font-size: 42px;
        margin-bottom: 8px;
      }

      .main-header p {
        color: #64748b;
      }

      .input-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 24px;
      }

      label {
        font-weight: 600;
        color: #1e293b;
      }
      small,
      .password-group {
        color: #64748b;
        font-size: 14px;
      }
      .input-group input {
        width: 100%;
        padding: 14px 16px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        outline: none;
      }

      .input-group input:focus {
        border-color: #4f46e5;
        box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
      }

      .password-container {
        display: flex;
        gap: 20px;
        margin-bottom: 24px;
      }
      .password-group {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .password-group input {
        width: 100%;
        padding: 14px 16px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        outline: none;
      }

      .password-group input:focus {
        border-color: #4f46e5;
        box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
      }

      .password-group small,
      .password-group p {
        margin: 0;
        font-size: 0.85rem;
        color: #64748b;
      }

      .register {
        background-color: #3830de;
        color: white;
        padding: 10px;
        border-radius: 7px;
        cursor: pointer;
        transition: 0.2s ease;
      }

      .register:hover {
        background-color: #0a00c2;
        transform: translateY(-2px) scale(1.007);
      }

      .main-footer {
        text-align: center;
        margin-top: 24px;
      }

      .main-footer span {
        color: #0b00d7;
        font-weight: 500;
        margin: 7px;
      }
    </style>
  </head>
  <body>
    <main>
      <form>
        <div class="main-header">
          <h1>Register</h1>
          <p>Fill in the information to get started</p>
        </div>

        <div class="input-group name">
          <label for="name">Full Name</label>
          <input type="text" placeholder="enter your full name" />
        </div>

        <div class="input-group username">
          <label for="username">Username</label>
          <input type="text" placeholder="Choose a username" />
          <small
            >3-20 characters, letters, numbers, and underscores only.</small
          >
        </div>

        <div class="input-group email">
          <label for="email">Email Address</label>
          <input type="text" placeholder="Enter your email address" />
        </div>

        <div class="password-container">
          <div class="password-group">
            <label for="password">Password</label>
            <input
              type="password"
              placeholder="create a password"
              id="password"
            />
            <small
              >Minimum 8 characters with letters, numbers, and symbols.</small
            >
          </div>
          <div class="password-group">
            <label for="confrim password">Confirm Password</label>
            <input
              type="password"
              placeholder="confirm your password"
              id="confirm-password"
            />
            <p>Password must match.</p>
          </div>
        </div>
        <button class="register">Register Account</button>
        <div class="main-footer">
          <p>Already have an account? <span>Sign in</span></p>
        </div>
      </form>
    </main>
  </body>
</html>
