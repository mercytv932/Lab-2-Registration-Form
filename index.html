<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        padding: 40px 20px;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      form {
        width: 100%;
        max-width: 700px;
        padding: 40px;
        background-color: white;
        display: flex;
        flex-direction: column;
        border-radius: 16px;
        box-shadow: 0 12px 35px rgb(0, 0, 0, 0.1);
      }

      .main-header {
        display: flex;
        flex-direction: column;
        font-style: sans-serif;
      }

      .input-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 24px;
      }
      .input-group input {
        width: 100%;
        padding: 14px 16px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        outline: none;
      }

      .input-group input:focus {
        border-color: #4f46e5;
        box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
      }
    </style>
  </head>
  <body>
    <main>
      <form>
        <div class="main-header">
          <h1>Register</h1>
          <p>Fill in the information to get started</p>
        </div>

        <div class="input-group name">
          <label for="name">Full Name</label>
          <input type="text" placeholder="enter your full name" />
        </div>

        <div class="input-group username">
          <label for="username">Username</label>
          <input type="text" placeholder="Choose a username" />
          <small>3-20 characters, letters, numbers, and underscores only.</small>
        </div>

        <div class="input-group email">
          <label for="email">Email Address</label>
          <input type="text" placeholder="Enter your email address" />
        </div>

        <div class="password-group">
          <div class="password-group password">
            <label for="password">Password</label>
            <input type="text" placeholder="create a password" />
            <small>Minimum 8 characters with letters, numbers, and symbols.</small>
          </div>
          <div class="password-group confirm">
            <label for="confrim password">Confirm Password</label>
            <input type="text" placeholder="confirm your password" />
            <p>Password must match.</p>
          </div>
        </div>
      </form>
      <button class="register">Register Account</button>
      <div class="main-footer">
        <p>Already have an account? <span>Sign in</span></p>
      </div>
    </main>
  </body>
</html>
