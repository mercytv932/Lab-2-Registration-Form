<!doctype html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="style.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up</title>
  </head>
  <body>
    <main>
      <form class="form">
        <div class="main-header">
          <h1>Register</h1>
          <p>Fill in the information to get started</p>
        </div>

        <div class="input-group name">
          <label for="full-name">Full Name</label>
          <input
            type="text"
            placeholder="enter your full name"
            id="full-name"
          />
        </div>

        <div class="input-group username">
          <label for="username">Username</label>
          <input type="text" placeholder="Choose a username" id="username" />
          <small
            >3-20 characters, letters, numbers, and underscores only.</small
          >
        </div>

        <div class="input-group email">
          <label for="email">Email Address</label>
          <input
            type="email"
            placeholder="Enter your email address"
            id="email"
          />
        </div>

        <div class="password-container">
          <div class="password-group">
            <label for="password">Password</label>
            <input
              type="password"
              placeholder="create a password"
              id="password"
            />
            <small
              >Minimum 8 characters with letters, numbers, and symbols.</small
            >
          </div>
          <div class="password-group">
            <label for="confirm-password">Confirm Password</label>
            <input
              type="password"
              placeholder="confirm your password"
              id="confirm-password"
            />
            <p>Password must match.</p>
          </div>
        </div>
        <button class="register" type="submit">Register Account</button>
        <div class="main-footer">
          <p>
            Already have an account? <a href=""> <span>Sign in</span></a>
          </p>
        </div>
      </form>
    </main>

    <script src="script.js"></script>
  </body>
</html>
