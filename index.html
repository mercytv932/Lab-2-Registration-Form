<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up</title>
  </head>
  <body>
    <main>
      <form>
        <div class="main-header">
          <h1>Register</h1>
          <p>Fill in the information to get started</p>
        </div>

        <div class="input-group name">
          <label for="name">Full Name</label>
          <input type="text" placeholder="enter your full name" />
        </div>

        <div class="input-group username">
          <label for="username">Username</label>
          <input type="text" placeholder="Choose a username" />
          <p>3-20 characters, letters, numbers, and underscores only.</p>
        </div>

        <div class="input-group email">
          <label for="email">Email Address</label>
          <input type="text" placeholder="Enter your email address" />
        </div>

        <div class="password-group">
          <div class="password-group password">
            <label for="password">Password</label>
            <input type="text" placeholder="create a password" />
            <p>Minimum 8 characters with letters, numbers, and symbols.</p>
          </div>
          <div class="password-group confirm">
            <label for="confrim password">Confirm Password</label>
            <input type="text" placeholder="confirm your password" />
            <p>Password must match.</p>
          </div>
        </div>
        <button class="register">Register Account</button>
        <div class="main-footer"></div>
      </form>
    </main>
  </body>
</html>
