<!doctype html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="style.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up</title>
  </head>
  <body>
    <main>
      <form class="form">
        <div class="main-header">
          <h1>Register</h1>
          <p>Fill in the information to get started</p>
        </div>

        <div class="input-group name">
          <label for="name">Full Name</label>
          <input
            type="text"
            placeholder="enter your full name"
            id="full-name"
          />
        </div>

        <div class="input-group username">
          <label for="username">Username</label>
          <input type="text" placeholder="Choose a username" id="username" />
          <small
            >3-20 characters, letters, numbers, and underscores only.</small
          >
        </div>

        <div class="input-group email">
          <label for="email">Email Address</label>
          <input
            type="text"
            placeholder="Enter your email address"
            id="email"
          />
        </div>

        <div class="password-container">
          <div class="password-group">
            <label for="password">Password</label>
            <input
              type="password"
              placeholder="create a password"
              id="password"
            />
            <small
              >Minimum 8 characters with letters, numbers, and symbols.</small
            >
          </div>
          <div class="password-group">
            <label for="confrim password">Confirm Password</label>
            <input
              type="password"
              placeholder="confirm your password"
              id="confirm-password"
            />
            <p>Password must match.</p>
          </div>
        </div>
        <button class="register">Register Account</button>
        <div class="main-footer">
          <p>
            Already have an account? <a href=""> <span>Sign in</span></a>
          </p>
        </div>
      </form>
    </main>

    <script>
      const form = document.querySelector(".form");
      const fullNameInput = document.querySelector("#full-name");
      const usernameInput = document.querySelector("#username");
      const emailInput = document.querySelector("#email");
      const passwordInput = document.querySelector("#password");
      const confirmPasswordInput = document.querySelector("#confirm-password");

      const registerBtn = document.querySelector(".register");

      form.addEventListener("submit", (event) => {
        event.preventDefault();
      });

      registerBtn.addEventListener("click", () => {
        if (fullNameInput.value === "") {
          alert("Please enter your name!");
        } else if (usernameInput.value === "") {
          alert("Please enter your username!");
        } else if (emailInput.value === "") {
          alert("Please eneter your email!");
        } else if (passwordInput.value === "") {
          alert("Please enter your password!");
        } else if (confirmPasswordInput.value === "") {
          alert("Please confirm your password!");
        } else if (passwordInput.value !== confirmPasswordInput.value) {
          alert("Your password do not match!");
        } else {
          const name = fullNameInput.value;
          const username = usernameInput.value;
          const email = emailInput.value;
          const password = passwordInput.value;
          const confirm = confirmPasswordInput.value;
        }
      });
    </script>
  </body>
</html>
